<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BookNook</title>

  <!-- Mobile Web App / iOS Home Screen Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="BookNook" />
  <meta name="theme-color" content="#FDFBF7" />

  <!-- Discourage stale browser caching of index.html -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- Google Fonts: Inter (UI) & Merriweather (Cozy Bookish Serif) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@700;900&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            serif: ['Merriweather', 'Georgia', 'serif'],
          },
        },
      },
    };
  </script>

  <!-- React 18 & Babel Standalone (Zero build step needed for GitHub Pages) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#FDFBF7] text-stone-800 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Fallback starter books shown only if no books.json or localStorage data exists yet
    const INITIAL_BOOKS = [
      {
        id: 'book-1',
        title: 'De Magische Avonturen van Daan',
        narrator: 'Ingesproken door Daan (7 jaar)',
        description: 'Ga mee op reis door betoverde bossen en ontmoet vriendelijke draken!',
        coverColor: 'from-amber-400 to-orange-500',
        emoji: '🐉',
        chapters: [
          { id: 'c1', title: 'Hoofdstuk 1: Het Verloren Bos', url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3', duration: '' },
          { id: 'c2', title: 'Hoofdstuk 2: De Vriendelijke Draak', url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3', duration: '' }
        ]
      }
    ];

    // Helper to convert Google Drive, Dropbox, or GitHub blob links into direct playable audio URLs
    const normalizeAudioUrl = (rawUrl) => {
      if (!rawUrl) return '';
      const url = rawUrl.trim();

      // Convert standard GitHub file page URLs (/blob/) to raw.githubusercontent.com automatically
      const githubBlobMatch = url.match(/^https?:\/\/github\.com\/([^/]+)\/([^/]+)\/blob\/(.+)$/);
      if (githubBlobMatch) {
        return `https://raw.githubusercontent.com/${githubBlobMatch[1]}/${githubBlobMatch[2]}/${githubBlobMatch[3]}`;
      }

      // Google Drive: /file/d/FILE_ID/view -> direct download stream
      const driveFileMatch = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
      if (driveFileMatch && driveFileMatch[1]) {
        return `https://drive.google.com/uc?export=download&id=${driveFileMatch[1]}`;
      }

      // Google Drive: open?id=FILE_ID format
      const driveOpenMatch = url.match(/drive\.google\.com\/open\?id=([a-zA-Z0-9_-]+)/);
      if (driveOpenMatch && driveOpenMatch[1]) {
        return `https://drive.google.com/uc?export=download&id=${driveOpenMatch[1]}`;
      }

      // Dropbox: change ?dl=0 or ?dl=1 to ?raw=1
      if (url.includes('dropbox.com/')) {
        return url.replace(/([?&])dl=[01]/, '$1raw=1').includes('raw=1')
          ? url.replace(/([?&])dl=[01]/, '$1raw=1')
          : `${url}${url.includes('?') ? '&' : '?'}raw=1`;
      }

      return url;
    };

    // Format seconds into mm:ss
    const formatTime = (secs) => {
      if (isNaN(secs) || !isFinite(secs) || secs < 0) return '0:00';
      const mins = Math.floor(secs / 60);
      const remainSecs = Math.floor(secs % 60);
      return `${mins}:${remainSecs < 10 ? '0' : ''}${remainSecs}`;
    };

    // Parse mm:ss (or hh:mm:ss) duration string into total seconds
    const parseDurationToSeconds = (durationStr) => {
      if (!durationStr || typeof durationStr !== 'string') return 0;
      const parts = durationStr.split(':').map(Number);
      if (parts.some(isNaN)) return 0;
      if (parts.length === 2) return parts[0] * 60 + parts[1];
      if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
      return 0;
    };

    function App() {
      const [books, setBooks] = useState(() => {
        try {
          const saved = localStorage.getItem('booknook_books');
          return saved ? JSON.parse(saved) : INITIAL_BOOKS;
        } catch (e) {
          return INITIAL_BOOKS;
        }
      });

      // Two parent profiles: 'ouder1' (Marcel) and 'ouder2' (Sophia)
      const [activeProfile, setActiveProfile] = useState(() => {
        return localStorage.getItem('booknook_active_profile') || 'ouder1';
      });

      const [currentView, setCurrentView] = useState('listener'); // 'listener' | 'admin'
      const [isAdminUnlocked, setIsAdminUnlocked] = useState(false);
      const [showPasswordModal, setShowPasswordModal] = useState(false);
      const [passwordInput, setPasswordInput] = useState('');
      const [passwordError, setPasswordError] = useState(false);
      const [adminPassword, setAdminPassword] = useState(() => {
        return localStorage.getItem('booknook_admin_password') || '1234';
      });
      const [newPasswordInput, setNewPasswordInput] = useState('');

      const [selectedBookId, setSelectedBookId] = useState(books[0]?.id || null);
      const [currentChapter, setCurrentChapter] = useState(books[0]?.chapters[0] || null);
      const [isPlaying, setIsPlaying] = useState(false);
      const [currentTime, setCurrentTime] = useState(0);
      const [duration, setDuration] = useState(0);
      const [playbackRate, setPlaybackRate] = useState(1);
      const [notification, setNotification] = useState(null);
      const [syncStatus, setSyncStatus] = useState('');
      const [isSyncing, setIsSyncing] = useState(false);
      const [progressVersion, setProgressVersion] = useState(0);

      // Admin form state
      const [editingBookId, setEditingBookId] = useState(null);
      const [bookForm, setBookForm] = useState({
        title: '',
        narrator: '',
        description: '',
        emoji: '📚',
        coverColor: 'from-amber-400 to-orange-500'
      });
      const [chaptersForm, setChaptersForm] = useState([{ title: '', url: '' }]);

      const audioRef = useRef(null);
      const pendingAutoPlayRef = useRef(false);
      const lastFetchTimeRef = useRef(0);

      const showNotification = (msg) => {
        setNotification(msg);
        setTimeout(() => setNotification(null), 3500);
      };

      // Fetch latest books.json bypassing browser & CDN caches
      const fetchSharedBooks = async (isManual = false) => {
        const now = Date.now();
        // Avoid rapid duplicate background checks (allow manual refresh anytime)
        if (!isManual && now - lastFetchTimeRef.current < 15000) return;
        lastFetchTimeRef.current = now;

        if (isManual) setIsSyncing(true);
        try {
          const response = await fetch(`./books.json?t=${now}`, {
            cache: 'no-store',
            headers: { 'Cache-Control': 'no-cache' }
          });
          if (!response.ok) {
            if (isManual) showNotification('Geen gedeelde boekenlijst gevonden.');
            return;
          }
          const remoteBooks = await response.json();
          if (!Array.isArray(remoteBooks) || remoteBooks.length === 0) return;

          const remoteStr = JSON.stringify(remoteBooks);
          const lastSyncedStr = localStorage.getItem('booknook_last_synced_json');

          // Update local library whenever a newer books.json is published on GitHub
          if (remoteStr !== lastSyncedStr) {
            setBooks(remoteBooks);
            localStorage.setItem('booknook_books', remoteStr);
            localStorage.setItem('booknook_last_synced_json', remoteStr);
            setSyncStatus('Boekenlijst bijgewerkt');
            showNotification('Nieuwe boeken of hoofdstukken geladen!');
          } else if (isManual) {
            setSyncStatus('Boekenlijst is up-to-date');
            showNotification('Boekenlijst is helemaal up-to-date!');
          }
        } catch (e) {
          if (isManual) showNotification('Kon boekenlijst niet verversen. Controleer internet.');
        } finally {
          if (isManual) setIsSyncing(false);
        }
      };

      // Automatically check for new books on load AND whenever parents reopen/return to the app
      useEffect(() => {
        fetchSharedBooks(false);

        const handleVisibilityChange = () => {
          if (document.visibilityState === 'visible') {
            fetchSharedBooks(false);
          }
        };

        document.addEventListener('visibilitychange', handleVisibilityChange);
        return () => document.removeEventListener('visibilitychange', handleVisibilityChange);
      }, []);

      // Keep localStorage updated whenever books change
      useEffect(() => {
        try {
          localStorage.setItem('booknook_books', JSON.stringify(books));
        } catch (e) {}
      }, [books]);

      // Ensure selectedBookId and currentChapter stay valid if books list changes (e.g. after sync)
      useEffect(() => {
        if (books.length === 0) return;
        const foundBook = books.find((b) => b.id === selectedBookId);
        if (!foundBook) {
          setSelectedBookId(books[0].id);
          setCurrentChapter(books[0].chapters[0] || null);
        } else if (currentChapter) {
          const foundChap = foundBook.chapters.find((c) => c.id === currentChapter.id);
          if (!foundChap) {
            setCurrentChapter(foundBook.chapters[0] || null);
          }
        }
      }, [books]);

      // Persist active profile and restore that parent's last active book & chapter
      useEffect(() => {
        localStorage.setItem('booknook_active_profile', activeProfile);
        setIsPlaying(false);
        pendingAutoPlayRef.current = false;
        if (audioRef.current) {
          audioRef.current.pause();
        }

        const savedStateStr = localStorage.getItem(`booknook_state_${activeProfile}`);
        if (savedStateStr) {
          try {
            const savedState = JSON.parse(savedStateStr);
            const foundBook = books.find((b) => b.id === savedState.bookId);
            if (foundBook) {
              setSelectedBookId(foundBook.id);
              const foundChapter =
                foundBook.chapters.find((c) => c.id === savedState.chapterId) || foundBook.chapters[0];
              setCurrentChapter(foundChapter || null);
              return;
            }
          } catch (e) {}
        }

        if (books.length > 0) {
          setSelectedBookId(books[0].id);
          setCurrentChapter(books[0].chapters[0] || null);
        }
      }, [activeProfile]);

      // Save active book and chapter per profile whenever they change
      useEffect(() => {
        if (selectedBookId && currentChapter) {
          localStorage.setItem(
            `booknook_state_${activeProfile}`,
            JSON.stringify({ bookId: selectedBookId, chapterId: currentChapter.id })
          );
        }
      }, [selectedBookId, currentChapter, activeProfile]);

      // Load saved timestamp per chapter AND per profile
      useEffect(() => {
        if (!currentChapter) return;
        const progressKey = `booknook_prog_${activeProfile}_${currentChapter.id}`;
        const savedTime = localStorage.getItem(progressKey);
        const parsedTime = savedTime ? parseFloat(savedTime) : 0;

        setCurrentTime(parsedTime);
        if (audioRef.current) {
          audioRef.current.playbackRate = playbackRate;
          if (pendingAutoPlayRef.current) {
            pendingAutoPlayRef.current = false;
            audioRef.current.load();
            audioRef.current.play().then(() => {
              setIsPlaying(true);
            }).catch(() => {
              setIsPlaying(false);
            });
          }
        }
      }, [currentChapter, activeProfile]);

      // Automatically detect real durations for chapters in the active book that don't have one yet
      useEffect(() => {
        const active = books.find((b) => b.id === selectedBookId) || books[0];
        if (!active) return;

        const audioElements = [];
        active.chapters.forEach((chap) => {
          if (!chap.duration && chap.url) {
            const tempAudio = new Audio();
            tempAudio.preload = 'metadata';
            tempAudio.src = normalizeAudioUrl(chap.url);
            tempAudio.onloadedmetadata = () => {
              if (tempAudio.duration && !isNaN(tempAudio.duration) && isFinite(tempAudio.duration)) {
                const formatted = formatTime(tempAudio.duration);
                setBooks((prevBooks) =>
                  prevBooks.map((book) => ({
                    ...book,
                    chapters: book.chapters.map((c) =>
                      c.id === chap.id ? { ...c, duration: formatted } : c
                    )
                  }))
                );
              }
            };
            audioElements.push(tempAudio);
          }
        });

        return () => {
          audioElements.forEach((a) => {
            a.onloadedmetadata = null;
            a.src = '';
          });
        };
      }, [selectedBookId, books.length]);

      // Play / Pause toggle
      const togglePlay = () => {
        if (!audioRef.current || !currentChapter) return;
        if (isPlaying) {
          audioRef.current.pause();
          setIsPlaying(false);
        } else {
          audioRef.current.play().then(() => {
            setIsPlaying(true);
          }).catch(() => {
            showNotification('Kan audio niet afspelen. Controleer de MP3 link.');
            setIsPlaying(false);
          });
        }
      };

      // Skip 15s backward/forward
      const skipTime = (seconds) => {
        if (!audioRef.current) return;
        const maxDur = audioRef.current.duration || duration || 0;
        const nextTime = Math.max(0, Math.min(maxDur, audioRef.current.currentTime + seconds));
        audioRef.current.currentTime = nextTime;
        setCurrentTime(nextTime);
        if (currentChapter) {
          localStorage.setItem(`booknook_prog_${activeProfile}_${currentChapter.id}`, nextTime);
        }
      };

      const handleTimeUpdate = () => {
        if (!audioRef.current) return;
        const time = audioRef.current.currentTime;
        setCurrentTime(time);
        setDuration(audioRef.current.duration || 0);

        if (currentChapter) {
          localStorage.setItem(`booknook_prog_${activeProfile}_${currentChapter.id}`, time);
        }
      };

      const handleSeek = (e) => {
        const newTime = parseFloat(e.target.value);
        if (audioRef.current) {
          audioRef.current.currentTime = newTime;
          setCurrentTime(newTime);
          if (currentChapter) {
            localStorage.setItem(`booknook_prog_${activeProfile}_${currentChapter.id}`, newTime);
          }
        }
      };

      const changeSpeed = () => {
        const speeds = [1, 1.25, 1.5, 0.75];
        const nextSpeed = speeds[(speeds.indexOf(playbackRate) + 1) % speeds.length];
        setPlaybackRate(nextSpeed);
        if (audioRef.current) {
          audioRef.current.playbackRate = nextSpeed;
        }
        showNotification(`Afspeelsnelheid: ${nextSpeed}x`);
      };

      const activeBook = books.find((b) => b.id === selectedBookId) || books[0];

      // Mark finished chapter as completed and automatically play the next chapter
      const handleChapterEnded = () => {
        if (!currentChapter) return;

        // Save completed status for this profile and clear saved midpoint so replaying starts at 0:00
        localStorage.setItem(`booknook_done_${activeProfile}_${currentChapter.id}`, 'true');
        localStorage.removeItem(`booknook_prog_${activeProfile}_${currentChapter.id}`);

        if (activeBook && activeBook.chapters) {
          const currentIndex = activeBook.chapters.findIndex((c) => c.id === currentChapter.id);
          if (currentIndex !== -1 && currentIndex + 1 < activeBook.chapters.length) {
            const nextChapter = activeBook.chapters[currentIndex + 1];
            pendingAutoPlayRef.current = true;
            setCurrentChapter(nextChapter);
            showNotification(`Volgend hoofdstuk: ${nextChapter.title}`);
            return;
          }
        }

        setIsPlaying(false);
        showNotification('Einde van het boek bereikt!');
      };

      // Unmark a finished chapter so it appears unplayed again
      const handleUnmarkFinished = (e, chap) => {
        e.stopPropagation();
        localStorage.removeItem(`booknook_done_${activeProfile}_${chap.id}`);
        localStorage.removeItem(`booknook_prog_${activeProfile}_${chap.id}`);
        if (currentChapter?.id === chap.id && audioRef.current) {
          audioRef.current.currentTime = 0;
          setCurrentTime(0);
        }
        setProgressVersion((v) => v + 1);
        showNotification(`"${chap.title}" gemarkeerd als niet-afgespeeld`);
      };

      // Download books.json for uploading to GitHub Pages
      const handleExportBooksJson = () => {
        try {
          const jsonStr = JSON.stringify(books, null, 2);
          const blob = new Blob([jsonStr], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'books.json';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showNotification('books.json gedownload! Upload dit bestand naar je GitHub repository.');
        } catch (e) {
          showNotification('Kon books.json niet downloaden.');
        }
      };

      // Admin actions
      const moveChapter = (index, direction) => {
        const targetIndex = index + direction;
        if (targetIndex < 0 || targetIndex >= chaptersForm.length) return;
        const updated = [...chaptersForm];
        [updated[index], updated[targetIndex]] = [updated[targetIndex], updated[index]];
        setChaptersForm(updated);
      };

      const handleSaveBook = (e) => {
        e.preventDefault();
        if (!bookForm.title.trim()) {
          showNotification('Vul een boektitel in.');
          return;
        }

        const validChapters = chaptersForm
          .filter((c) => c.title.trim() && c.url.trim())
          .map((c, idx) => ({
            id: c.id || `c-${Date.now()}-${idx}`,
            title: c.title.trim(),
            url: normalizeAudioUrl(c.url),
            duration: c.duration || ''
          }));

        if (validChapters.length === 0) {
          showNotification('Voeg ten minste één hoofdstuk toe met een MP3 link.');
          return;
        }

        if (editingBookId) {
          setBooks(
            books.map((b) =>
              b.id === editingBookId ? { ...b, ...bookForm, chapters: validChapters } : b
            )
          );
          showNotification('Boek bijgewerkt! Vergeet niet books.json te downloaden voor andere apparaten.');
        } else {
          const newBook = {
            id: `book-${Date.now()}`,
            ...bookForm,
            chapters: validChapters
          };
          setBooks([...books, newBook]);
          setSelectedBookId(newBook.id);
          setCurrentChapter(newBook.chapters[0]);
          showNotification('Nieuw boek toegevoegd! Download books.json om te delen met Marcel & Sophia.');
        }

        setEditingBookId(null);
        setBookForm({
          title: '',
          narrator: '',
          description: '',
          emoji: '📚',
          coverColor: 'from-amber-400 to-orange-500'
        });
        setChaptersForm([{ title: '', url: '' }]);
      };

      const handleEditBook = (book) => {
        setEditingBookId(book.id);
        setBookForm({
          title: book.title,
          narrator: book.narrator,
          description: book.description,
          emoji: book.emoji,
          coverColor: book.coverColor
        });
        setChaptersForm(book.chapters.map((c) => ({ ...c })));
        setCurrentView('admin');
      };

      const handleDeleteBook = (id) => {
        const updated = books.filter((b) => b.id !== id);
        setBooks(updated);
        if (selectedBookId === id && updated.length > 0) {
          setSelectedBookId(updated[0].id);
          setCurrentChapter(updated[0].chapters[0]);
        } else if (updated.length === 0) {
          setSelectedBookId(null);
          setCurrentChapter(null);
        }
        showNotification('Boek verwijderd.');
      };

      const handleOpenAdmin = () => {
        if (isAdminUnlocked) {
          setCurrentView('admin');
        } else {
          setPasswordInput('');
          setPasswordError(false);
          setShowPasswordModal(true);
        }
      };

      const handleUnlockAdmin = (e) => {
        e.preventDefault();
        if (passwordInput === adminPassword) {
          setIsAdminUnlocked(true);
          setShowPasswordModal(false);
          setCurrentView('admin');
          setPasswordInput('');
          setPasswordError(false);
          showNotification('Beheerdersmodus ontgrendeld');
        } else {
          setPasswordError(true);
        }
      };

      const handleUpdatePassword = (e) => {
        e.preventDefault();
        if (newPasswordInput.trim().length < 4) {
          showNotification('Kies een wachtwoord van minimaal 4 tekens.');
          return;
        }
        localStorage.setItem('booknook_admin_password', newPasswordInput.trim());
        setAdminPassword(newPasswordInput.trim());
        setNewPasswordInput('');
        showNotification('Beheerderswachtwoord gewijzigd!');
      };

      return (
        <div className="min-h-screen bg-[#FDFBF7] text-stone-800 flex flex-col font-sans selection:bg-amber-200">
          {/* Hidden Audio Element */}
          {currentChapter && (
            <audio
              ref={audioRef}
              src={normalizeAudioUrl(currentChapter.url)}
              preload="metadata"
              onTimeUpdate={handleTimeUpdate}
              onEnded={handleChapterEnded}
              onError={() => {
                setIsPlaying(false);
                showNotification('Audio kon niet worden geladen. Controleer de MP3 link.');
              }}
              onLoadedMetadata={() => {
                if (audioRef.current) {
                  audioRef.current.playbackRate = playbackRate;
                  const realDuration = audioRef.current.duration;
                  setDuration(realDuration);

                  if (realDuration && !isNaN(realDuration) && isFinite(realDuration)) {
                    const formatted = formatTime(realDuration);
                    setBooks((prevBooks) =>
                      prevBooks.map((book) => ({
                        ...book,
                        chapters: book.chapters.map((c) =>
                          c.id === currentChapter.id && c.duration !== formatted
                            ? { ...c, duration: formatted }
                            : c
                        )
                      }))
                    );
                  }

                  const savedTime = localStorage.getItem(`booknook_prog_${activeProfile}_${currentChapter.id}`);
                  if (savedTime) {
                    const parsed = parseFloat(savedTime);
                    if (!isNaN(parsed) && parsed < realDuration - 2) {
                      audioRef.current.currentTime = parsed;
                      setCurrentTime(parsed);
                    }
                  }
                }
              }}
            />
          )}

          {/* Toast Notification */}
          {notification && (
            <div className="fixed top-5 left-1/2 transform -translate-x-1/2 z-50 bg-stone-900 text-stone-100 px-6 py-3 rounded-2xl shadow-xl border border-stone-700 text-sm font-medium flex items-center space-x-2 max-w-[90vw] text-center">
              <span>🔔</span>
              <span>{notification}</span>
            </div>
          )}

          {/* Password Modal for Beheerder */}
          {showPasswordModal && (
            <div className="fixed inset-0 z-50 bg-stone-900/50 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 sm:p-8 max-w-sm w-full border border-stone-200 shadow-2xl space-y-5">
                <div className="flex items-center space-x-3">
                  <div className="w-10 h-10 rounded-2xl bg-amber-100 text-amber-800 flex items-center justify-center text-lg">
                    🔒
                  </div>
                  <div>
                    <h3 className="text-lg font-serif font-bold text-stone-900">Beheerder Toegang</h3>
                    <p className="text-xs text-stone-500">Voer het wachtwoord in om boeken te beheren</p>
                  </div>
                </div>

                <form onSubmit={handleUnlockAdmin} className="space-y-4">
                  <div>
                    <input
                      type="password"
                      autoFocus
                      value={passwordInput}
                      onChange={(e) => {
                        setPasswordInput(e.target.value);
                        setPasswordError(false);
                      }}
                      placeholder="Wachtwoord (standaard: 1234)"
                      className={`w-full px-4 py-3 rounded-xl border text-sm focus:outline-none focus:ring-2 ${
                        passwordError
                          ? 'border-red-400 focus:ring-red-300 bg-red-50/40'
                          : 'border-stone-300 focus:ring-amber-400'
                      }`}
                    />
                    {passwordError && (
                      <p className="text-xs text-red-600 mt-1.5 font-medium">
                        Onjuist wachtwoord. Probeer het opnieuw.
                      </p>
                    )}
                  </div>

                  <div className="flex items-center justify-end space-x-2 pt-1">
                    <button
                      type="button"
                      onClick={() => setShowPasswordModal(false)}

              <div className="max-w-4xl mx-auto flex flex-col space-y-3">
                {/* Seek Bar & Times */}
                <div className="flex items-center space-x-3">
                  <span className="text-xs font-mono text-stone-500 w-10 text-right">{formatTime(currentTime)}</span>
                  <input
                    type="range"
                    min="0"
                    max={duration || 100}
                    value={currentTime}
                    onChange={handleSeek}
                    className="flex-1 h-2.5 bg-stone-200 rounded-lg appearance-none cursor-pointer accent-amber-600"
                  />
                  <span className="text-xs font-mono text-stone-500 w-10">{formatTime(duration)}</span>
                </div>

                {/* Controls & Track Info */}
                <div className="flex items-center justify-between">
                  <div className="flex items-center space-x-3 w-1/3 min-w-0">
                    <div className={`w-10 h-10 rounded-xl bg-gradient-to-br ${activeBook?.coverColor || 'from-amber-400 to-orange-500'} flex items-center justify-center text-lg text-white shadow shrink-0`}>
                      {activeBook?.emoji || '📖'}
                    </div>
                    <div className="min-w-0">
                      <p className="text-xs font-serif font-bold text-stone-900 truncate">{currentChapter.title}</p>
                      <p className="text-[11px] text-amber-700 truncate">{activeBook?.title}</p>
                    </div>
                  </div>

                  <div className="flex items-center space-x-3 sm:space-x-4">
                    {/* Skip Backward 15s */}
                    <button
                      type="button"
                      onClick={() => skipTime(-15)}
                      title="15 seconden terug"
                      className="w-11 h-11 rounded-full bg-stone-100 hover:bg-stone-200 text-stone-700 flex items-center justify-center text-xs font-bold transition-all shadow-sm cursor-pointer select-none"
                    >
                      ↺ 15s
                    </button>

                    {/* Play / Pause Toggle */}
                    <button
                      type="button"
                      onClick={togglePlay}
                      aria-label={isPlaying ? 'Pauzeren' : 'Afspelen'}
                      className="w-14 h-14 rounded-full bg-amber-600 hover:bg-amber-700 text-white flex items-center justify-center shadow-lg shadow-amber-600/30 transition-transform active:scale-95 cursor-pointer select-none relative z-10"
                    >
                      {isPlaying ? (
                        <svg className="w-6 h-6 pointer-events-none" fill="currentColor" viewBox="0 0 24 24">
                          <rect x="6" y="4" width="4" height="16" rx="1" />
                          <rect x="14" y="4" width="4" height="16" rx="1" />
                        </svg>
                      ) : (
                        <svg className="w-6 h-6 ml-0.5 pointer-events-none" fill="currentColor" viewBox="0 0 24 24">
                          <path d="M8 5v14l11-7z" />
                        </svg>
                      )}
                    </button>

                    {/* Skip Forward 15s */}
                    <button
                      type="button"
                      onClick={() => skipTime(15)}
                      title="15 seconden vooruit"
                      className="w-11 h-11 rounded-full bg-stone-100 hover:bg-stone-200 text-stone-700 flex items-center justify-center text-xs font-bold transition-all shadow-sm cursor-pointer select-none"
                    >
                      15s ↻
                    </button>
                  </div>

                  <div className="flex items-center justify-end space-x-3 w-1/3">
                    <button
                      type="button"
                      onClick={changeSpeed}
                      className="px-3 py-1.5 rounded-lg bg-stone-100 hover:bg-stone-200 text-xs font-mono font-bold text-stone-700 transition-colors"
                      title="Afspeelsnelheid wijzigen"
                    >
                      {playbackRate}x
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
